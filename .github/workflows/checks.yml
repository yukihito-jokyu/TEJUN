name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24.9.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: arduino/setup-task@v3
        with:
          version: 3.45.5
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-only: true
      - run: npm install --global npm@11.12.1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium
        working-directory: frontend
      - run: task check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ github.run_id }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  backend-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - run: go test ./internal/domain/procedure ./internal/application ./internal/adapter/wails
      - run: go test ./internal/adapter/sqlite
        if: runner.os == 'Linux'
      - run: go test ./internal/adapter/export
        if: runner.os == 'Linux'
      - run: go test ./internal/adapter/sqlite -run 'TestProcedure(DraftLifecycle|SaveContractRollbackAndReplay|RevisionRequestContract|RevisionJob|RevisionRejectsTrailingJSON|RevisionRecovery|RevisionTerminalRecovery|RevisionCommitSurvivesEventDeliveryGap|EvidenceRelationAndTextPage)'
        if: runner.os == 'Windows'
      - run: go test ./internal/adapter/export -run 'Test(Render|PDF|JPEG|PreparedSelectionValidation)'
        if: runner.os == 'Windows'
